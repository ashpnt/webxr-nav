<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR Sandbox: Акселерометр и Шагомер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #f5f5f5;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active {
            background-color: #0056b3;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .big-number {
            font-size: 32px;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Шагомер (PDR)</h2>
        <p>Держите телефон ровно перед собой.</p>
        <button id="requestBtn">1. Разрешить доступ к датчикам</button>
        <button id="startBtn" style="display: none; background-color: #28a745;">2. Начать запись</button>
        <button id="stopBtn" style="display: none; background-color: #dc3545;">Остановить</button>
    </div>

    <div class="card">
        <h3 style="text-align: center; margin-top: 0;">Шагов сделано:</h3>
        <div class="big-number" id="stepCountDisplay">0</div>
    </div>

    <div class="card">
        <h3>Сырые данные (Акселерометр без гравитации)</h3>
        <div class="data-row"><span>Ось X:</span> <strong id="valX">0.00</strong></div>
        <div class="data-row"><span>Ось Y:</span> <strong id="valY">0.00</strong></div>
        <div class="data-row"><span>Ось Z (вверх-вниз):</span> <strong id="valZ">0.00</strong></div>
        <div class="data-row"><span>Магнитуда вектора:</span> <strong id="valMag">0.00</strong></div>
        <div class="data-row" style="color: #666;"><span>Сглаженная магнитуда:</span> <strong id="valSmooth">0.00</strong></div>
    </div>

    <script>
        // Элементы UI
        const requestBtn = document.getElementById('requestBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const valMag = document.getElementById('valMag');
        const valSmooth = document.getElementById('valSmooth');
        const stepCountDisplay = document.getElementById('stepCountDisplay');

        // Переменные для алгоритма шагомера
        let stepCount = 0;
        let isRecording = false;
        
        // --- НАСТРОЙКИ АЛГОРИТМА ---
        // 1. Сглаживание (от 0 до 1). Чем меньше, тем сильнее сглаживание (меньше реакция на дрожь).
        const ALPHA = 0.15; 
        let smoothedMag = 0;

        // 2. Временные рамки шага
        const MIN_TIME_BETWEEN_STEPS = 350; // Человек редко шагает быстрее 3 раз в сек (333ms)
        const MAX_TIME_BETWEEN_STEPS = 2000; // Если пауза дольше 2 сек, серия шагов прервалась
        let lastStepTime = 0;

        // 3. Динамический анализ пиков (Peak Detection)
        const PEAK_THRESHOLD = 1.9; // Минимальная разница между пиком и спадом, чтобы считать это шагом
        let minMag = 999;
        let maxMag = -999;
        let isPeakLooking = true; // Флаг: ищем ли мы сейчас максимум (пик) или минимум (впадину)

        // Запрос разрешений (Обязательно для iOS 13+)
        requestBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        requestBtn.style.display = 'none';
                        startBtn.style.display = 'block';
                    } else {
                        alert('Доступ к датчикам отклонен.');
                    }
                } catch (error) {
                    console.error('Ошибка запроса разрешений:', error);
                }
            } else {
                // Для Android и старых iOS разрешения не требуются явным образом
                requestBtn.style.display = 'none';
                startBtn.style.display = 'block';
            }
        });

        // Обработчик данных акселерометра
        function handleMotion(event) {
            if (!isRecording) return;

            // Используем ускорение БЕЗ учета гравитации (если доступно).
            let acc = event.acceleration;
            
            // Если чистое ускорение недоступно, берем с гравитацией (хуже, но работает)
            if (!acc || acc.x === null) {
                acc = event.accelerationIncludingGravity;
            }

            if (acc && acc.x !== null) {
                valX.innerText = acc.x.toFixed(2);
                valY.innerText = acc.y.toFixed(2);
                valZ.innerText = acc.z.toFixed(2);

                // Вычисляем магнитуду вектора ускорения (общую силу движения во все стороны)
                const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                valMag.innerText = magnitude.toFixed(2);

                detectStep(magnitude);
            }
        }

        // УЛУЧШЕННЫЙ алгоритм детекции шагов (EMA + Dynamic Peak Detection)
        function detectStep(rawMagnitude) {
            // 1. Сглаживаем сырые данные (убираем шум от дрожи рук)
            // Инициализация при первом запуске
            if (smoothedMag === 0) smoothedMag = rawMagnitude; 
            
            // Формула экспоненциального скользящего среднего
            smoothedMag = ALPHA * rawMagnitude + (1 - ALPHA) * smoothedMag;
            valSmooth.innerText = smoothedMag.toFixed(2);

            const currentTime = Date.now();
            
            // 2. Ищем пики и впадины на сглаженном графике
            if (isPeakLooking) {
                // Если мы идем вверх, обновляем максимум
                if (smoothedMag > maxMag) {
                    maxMag = smoothedMag;
                } else if (maxMag - smoothedMag > PEAK_THRESHOLD) {
                    // Если график начал падать и упал ниже максимума на величину порога - ПИК НАЙДЕН
                    // Но это еще не шаг. Шаг засчитывается только после полного цикла (вниз-вверх).
                    isPeakLooking = false; 
                    minMag = smoothedMag; // Начинаем искать минимум
                }
            } else {
                // Если мы идем вниз, обновляем минимум
                if (smoothedMag < minMag) {
                    minMag = smoothedMag;
                } else if (smoothedMag - minMag > PEAK_THRESHOLD) {
                    // Если график начал расти и поднялся выше минимума на величину порога - ВПАДИНА НАЙДЕНА
                    // Это значит, что нога опустилась и цикл шага завершен!
                    
                    isPeakLooking = true; // Снова начинаем искать пик
                    maxMag = smoothedMag; // Сбрасываем максимум для следующего шага
                    
                    // 3. Финальная проверка по времени (отсекаем случайные быстрые взмахи)
                    const timeSinceLastStep = currentTime - lastStepTime;
                    
                    if (timeSinceLastStep > MIN_TIME_BETWEEN_STEPS && timeSinceLastStep < MAX_TIME_BETWEEN_STEPS) {
                        // ЭТО НАСТОЯЩИЙ ШАГ
                        stepCount++;
                        stepCountDisplay.innerText = stepCount;
                        lastStepTime = currentTime;
                        
                        // Визуальный отклик
                        document.body.style.backgroundColor = '#e8f5e9';
                        setTimeout(() => { document.body.style.backgroundColor = '#f5f5f5'; }, 150);
                    } else if (timeSinceLastStep >= MAX_TIME_BETWEEN_STEPS) {
                        // Если была долгая пауза, мы не засчитываем этот всплеск как шаг,
                        // но обновляем таймер, чтобы следующий шаг в новой серии мог быть засчитан.
                        lastStepTime = currentTime;
                    }
                }
            }
        }

        // Управление записью
        startBtn.addEventListener('click', () => {
            isRecording = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            window.addEventListener('devicemotion', handleMotion);
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            stopBtn.style.display = 'none';
            startBtn.style.display = 'block';
            window.removeEventListener('devicemotion', handleMotion);
        });
    </script>
</body>
</html>
