<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR Sandbox: Акселерометр и Шагомер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #f5f5f5;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .graph-container {
            width: 100%;
            height: 100px;
            background: #eee;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        .graph-bar {
            position: absolute;
            bottom: 50%;
            width: 2px;
            background: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active {
            background-color: #0056b3;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .big-number {
            font-size: 32px;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Шагомер (PDR)</h2>
        <p>Держите телефон ровно перед собой.</p>
        <button id="requestBtn">1. Разрешить доступ к датчикам</button>
        <button id="startBtn" style="display: none; background-color: #28a745;">2. Начать запись</button>
        <button id="stopBtn" style="display: none; background-color: #dc3545;">Остановить</button>
    </div>

    <div class="card">
        <h3 style="text-align: center; margin-top: 0;">Шагов сделано:</h3>
        <div class="big-number" id="stepCountDisplay">0</div>
        
        <h4 style="margin-bottom: 5px;">Вертикальное ускорение:</h4>
        <div class="graph-container" id="graph">
            <!-- Здесь будут полоски графика -->
        </div>
    </div>

    <div class="card">
        <h3>Сырые данные (Акселерометр без гравитации)</h3>
        <div class="data-row"><span>Ось X:</span> <strong id="valX">0.00</strong></div>
        <div class="data-row"><span>Ось Y:</span> <strong id="valY">0.00</strong></div>
        <div class="data-row"><span>Ось Z (вверх-вниз):</span> <strong id="valZ">0.00</strong></div>
        <!-- Убираем магнитуду, она больше не нужна -->
        <div class="data-row" style="color: #666;"><span>Вертикальное уск. (Z-проекция):</span> <strong id="valVertical">0.00</strong></div>
    </div>

    <script>
        // Элементы UI
        const requestBtn = document.getElementById('requestBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const valVertical = document.getElementById('valVertical');
        const stepCountDisplay = document.getElementById('stepCountDisplay');
        const graphContainer = document.getElementById('graph');

        // Переменные для алгоритма шагомера
        let stepCount = 0;
        let isRecording = false;
        
        // --- НОВЫЕ НАСТРОЙКИ АЛГОРИТМА (High-Pass + Dot Product) ---
        
        // Вектор гравитации (накапливается со временем)
        let gravity = { x: 0, y: 0, z: 0 };
        // Коэффициент фильтра для оценки гравитации (0.8 = сильно доверяем прошлому значению, медленно меняем)
        const GRAVITY_ALPHA = 0.8; 

        // Сглаживание итогового вертикального сигнала
        let smoothedVerticalAccel = 0;
        const SIGNAL_ALPHA = 0.3;

        // Порог для детекции шага (намного точнее, так как сигнал очищен)
        const STEP_THRESHOLD = 0.8; 
        
        // Переменные для поиска пересечения нуля (Zero-Crossing)
        let lastSignal = 0;
        let isLookingForPeak = true;
        let peakValue = 0;
        
        // Временные рамки
        const MIN_TIME_BETWEEN_STEPS = 300; 
        let lastStepTime = 0;

        // Для отрисовки графика
        let graphPos = 0;

        // Запрос разрешений (Обязательно для iOS 13+)
        requestBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        requestBtn.style.display = 'none';
                        startBtn.style.display = 'block';
                    } else {
                        alert('Доступ к датчикам отклонен.');
                    }
                } catch (error) {
                    console.error('Ошибка запроса разрешений:', error);
                }
            } else {
                // Для Android и старых iOS разрешения не требуются явным образом
                requestBtn.style.display = 'none';
                startBtn.style.display = 'block';
            }
        });

        // Обработчик данных акселерометра
        function handleMotion(event) {
            if (!isRecording) return;

            // Нам НУЖНА гравитация, чтобы понять, где низ.
            let acc = event.accelerationIncludingGravity;
            
            // Запасной вариант, если недоступно (редкость)
            if (!acc || acc.x === null) {
               acc = event.acceleration;
               if (!acc) return;
            }

            if (acc && acc.x !== null) {
                valX.innerText = acc.x.toFixed(2);
                valY.innerText = acc.y.toFixed(2);
                valZ.innerText = acc.z.toFixed(2);

                detectStepAdvanced(acc.x, acc.y, acc.z);
            }
        }

        // Продвинутый алгоритм детекции
        function detectStepAdvanced(x, y, z) {
            // Мы "вытягиваем" постоянную силу тяжести из тряски.
            if (gravity.x === 0 && gravity.y === 0 && gravity.z === 0) {
                // Инициализация
                gravity.x = x; gravity.y = y; gravity.z = z;
            } else {
                gravity.x = GRAVITY_ALPHA * gravity.x + (1 - GRAVITY_ALPHA) * x;
                gravity.y = GRAVITY_ALPHA * gravity.y + (1 - GRAVITY_ALPHA) * y;
                gravity.z = GRAVITY_ALPHA * gravity.z + (1 - GRAVITY_ALPHA) * z;
            }

            // Вычитаем гравитацию из сырых данных. Остается только чистое движение телефона.
            let linearX = x - gravity.x;
            let linearY = y - gravity.y;
            let linearZ = z - gravity.z;

            // Нам нужно только то ускорение, которое направлено ВДОЛЬ вектора гравитации (т.е. вверх-вниз относительно земли, как бы мы ни крутили телефон).
            // Нормализуем вектор гравитации (длина = 1)
            let norm = Math.sqrt(gravity.x*gravity.x + gravity.y*gravity.y + gravity.z*gravity.z);
            let gNormX = gravity.x / norm;
            let gNormY = gravity.y / norm;
            let gNormZ = gravity.z / norm;

            // Скалярное произведение: linear * gNorm = проекция движения на ось гравитации
            let verticalAccel = (linearX * gNormX) + (linearY * gNormY) + (linearZ * gNormZ);

            smoothedVerticalAccel = SIGNAL_ALPHA * verticalAccel + (1 - SIGNAL_ALPHA) * smoothedVerticalAccel;
            valVertical.innerText = smoothedVerticalAccel.toFixed(2);
            
            drawGraph(smoothedVerticalAccel);

            const currentTime = Date.now();
            
            // Если мы идем вверх, ищем самый высокий пик
            if (smoothedVerticalAccel > STEP_THRESHOLD) {
                isLookingForPeak = true;
                if (smoothedVerticalAccel > peakValue) {
                    peakValue = smoothedVerticalAccel;
                }
            }
            
            // Если волна пошла вниз, пересекла ноль (или упала достаточно низко после пика)
            if (isLookingForPeak && smoothedVerticalAccel < 0) {
                // Проверяем, был ли пик достаточно высоким и прошло ли достаточно времени
                if (peakValue >= STEP_THRESHOLD && (currentTime - lastStepTime) > MIN_TIME_BETWEEN_STEPS) {
                    // НАСТОЯЩИЙ ШАГ
                    stepCount++;
                    stepCountDisplay.innerText = stepCount;
                    lastStepTime = currentTime;
                    
                    // Визуальный отклик
                    document.body.style.backgroundColor = '#e8f5e9';
                    setTimeout(() => { document.body.style.backgroundColor = '#f5f5f5'; }, 150);
                }
                
                // Сброс для следующего шага
                isLookingForPeak = false;
                peakValue = 0;
            }
        }

        function drawGraph(val) {
            graphPos += 3;
            if (graphPos > graphContainer.offsetWidth) {
                graphPos = 0;
                graphContainer.innerHTML = ''; // Очистка графика
            }
            
            const bar = document.createElement('div');
            bar.className = 'graph-bar';
            bar.style.left = graphPos + 'px';
            
            // Масштабируем значение для графика (умножаем на 10 для наглядности)
            let height = Math.abs(val) * 10;
            if (height > 50) height = 50; // Ограничение по высоте контейнера
            
            bar.style.height = height + 'px';
            
            if (val > 0) {
                bar.style.bottom = '50%';
                bar.style.background = '#28a745'; // Вверх - зеленый
            } else {
                bar.style.bottom = (50 - height) + 'px';
                bar.style.background = '#dc3545'; // Вниз - красный
            }
            
            graphContainer.appendChild(bar);
        }

        // Управление записью
        startBtn.addEventListener('click', () => {
            isRecording = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            window.addEventListener('devicemotion', handleMotion);
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            stopBtn.style.display = 'none';
            startBtn.style.display = 'block';
            window.removeEventListener('devicemotion', handleMotion);
        });
    </script>
</body>
</html>
